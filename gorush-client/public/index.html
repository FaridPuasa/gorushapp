<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Go Rush is a courier and delivery service in Brunei offering fast parcel delivery, errand running, and logistics for individuals and businesses." />
    <!-- No static canonical/robots meta here - this one shell is shared by every route, so a
         fixed canonical would wrongly tell crawlers every page's "real" URL is the homepage.
         Each page sets its own via PageScroll (lib/formPrimitives.js) / this file's own Head
         instead - omitting it here entirely (rather than defaulting to index,follow) avoids a
         brief window, before that per-page tag mounts, where two conflicting robots directives
         could both be present in the DOM at once. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Go Rush" />
    <meta property="og:title" content="Go Rush - Courier & Delivery Service in Brunei" />
    <meta property="og:description" content="Fast parcel delivery, errand running, and logistics across Brunei. Book a rider or track your delivery with Go Rush." />
    <meta property="og:url" content="https://gorushbn.com/" />
    <meta property="og:image" content="https://gorushbn.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Go Rush - Courier & Delivery Service in Brunei" />
    <meta name="twitter:description" content="Fast parcel delivery, errand running, and logistics across Brunei. Book a rider or track your delivery with Go Rush." />
    <meta name="twitter:image" content="https://gorushbn.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Go Rush",
        "image": "https://gorushbn.com/og-image.png",
        "url": "https://gorushbn.com/",
        "telephone": ["+6732332065", "+6732353259"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit 7, 1st Floor, Block B, Bangunan Begawan Pehin Dato Hj Md Yusof, Simpang 88, Kg. Kiulap",
          "addressLocality": "Bandar Seri Begawan",
          "postalCode": "BE1518",
          "addressCountry": "BN"
        },
        "sameAs": [
          "https://www.facebook.com/go.rush.bwn",
          "https://www.instagram.com/gorush.bn",
          "https://www.tiktok.com/@gorushexpress"
        ]
      }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#1B75BB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Go Rush" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Initial-load splash, shown instantly (pure CSS/HTML, no JS needed)
         while the web bundle downloads/parses/executes - without this,
         #root is blank white until React mounts, which on a slow connection
         reads as "the page is stuck" rather than "the app is loading". React
         replaces #root's entire innerHTML on mount, so #initial-splash is
         automatically removed once the real app renders - no manual cleanup
         needed, and nothing here can get left behind or go stale. */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      @media (prefers-color-scheme: dark) {
        #initial-splash { background: #0b1220; }
      }
      #initial-splash-spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 4px solid rgba(27, 117, 187, 0.25);
        border-top-color: #1B75BB;
        animation: initial-splash-spin 0.8s linear infinite;
      }
      @keyframes initial-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-10LQXBS0FF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-10LQXBS0FF', { send_page_view: false });
    </script>

    <!-- PWA install support (2026-09-29). Feature-detected/wrapped so any
         browser too old to support one of these pieces just skips it -
         nothing here is required for the site itself to work, it's purely
         additive (progressive enhancement), so no version/browser is ever
         left with a broken page because of this. -->
    <script>
      // Registers the service worker (unlocks "installable" standalone-app
      // behavior on Chromium browsers). Safe no-op on any browser without
      // service worker support at all (old Safari/old Android WebView).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }

      // Chrome's install prompt can fire before the React app has even
      // mounted (or the person may never visit the Get the App page at
      // all) - captured here, once, for as long as the page stays open, so
      // the Get the App page can trigger it later on demand instead of
      // relying on Chrome's own address-bar icon.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });

      // Fires once the install actually completes (from either Chrome's own
      // UI or our triggered prompt) - not available on iOS Safari at all,
      // which is fine, this is purely a nice-to-have analytics signal.
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        if (window.gtag) window.gtag('event', 'pwa_installed');
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. React's client-side render()
         clears this element's children on mount, so #initial-splash below
         disappears on its own - no JS needed to remove it, and it can never
         get stuck showing after the app has actually loaded. -->
    <div id="root">
      <div id="initial-splash" aria-hidden="true">
        <div id="initial-splash-spinner"></div>
      </div>
    </div>
  </body>
</html>
